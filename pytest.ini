[pytest]
# Pytest configuration for Sky Test Automation Framework

# Markers
markers =
    smoke: Smoke tests - quick validation
    regression: Regression tests
    sanity: Sanity tests
    integration: Integration tests
    unit: Unit tests
    jira: JIRA ID reference (e.g., SKY-1234)
    data_driven: Data-driven tests
    skip_test: Skip test execution

# Test discovery
testpaths = sky-tests-automation/test-scripts
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --html=sky-tests-automation/reports/report.html
    --self-contained-html

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (in seconds)
timeout = 300

# Minimum Python version
minversion = 3.8

# Test execution settings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
